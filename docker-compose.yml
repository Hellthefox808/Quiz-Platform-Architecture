services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: assessment_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/assessment_db
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/assessment_db
      - SECRET_KEY=production-secret-key-change-me-immediately-88776655
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessment_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    container_name: assessment_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=assessment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assessment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
